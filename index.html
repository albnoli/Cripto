<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Crypto Tracker</title>
    <style>
        :root { --primary: #2563eb; --dark: #0f172a; --bg: #f1f5f9; }
        body { font-family: sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1, h2 { text-align: center; color: var(--primary); margin-bottom: 20px; }
        h2 { font-size: 1.2rem; color: var(--dark); margin-top: 0; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .btn-add { background: var(--primary); margin-bottom: 10px; }
        .btn-search { background: var(--dark); }
        #status { text-align: center; margin-top: 10px; font-weight: bold; font-size: 0.85rem; }
        hr { margin: 30px 0; border: none; border-top: 1px solid #ddd; }
        .result-card { background: #f8fafc; padding: 15px; border-radius: 10px; border: 1px solid #e2e8f0; margin-top: 15px; }
        .historial { font-size: 0.8rem; color: #64748b; margin-top: 10px; padding-left: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h1>Crypto Tracker</h1>

    <div class="input-group">
        <label>Moneda (Ticker)</label>
        <input type="text" id="coin" placeholder="Ej: BTC, XRP, HBAR">
    </div>
    <div class="input-group">
        <label>Precio de compra</label>
        <input type="text" id="price" placeholder="Ej: 0.55 o 20000">
    </div>
    <div class="input-group">
        <label>Cantidad comprada</label>
        <input type="text" id="qty" placeholder="Ej: 0.004987">
    </div>
    <button class="btn-add" onclick="saveData()">Registrar Compra</button>
    <div id="status"></div>

    <hr>

    <h2>Consultar Cartera</h2>
    <div class="input-group">
        <input type="text" id="searchCoin" placeholder="Ticker a buscar...">
    </div>
    <button class="btn-search" onclick="getData()">Ver Resumen</button>
    <div id="displayArea"></div>
</div>

<script>
    // ⚠️ SUSTITUYE ESTA URL POR LA TUYA DE GOOGLE SCRIPTS ⚠️
    const URL_APP = "https://script.google.com/macros/s/AKfycbwy1bZqPqa-8vHdv7Zu14UsH3vmnqIjtlqoOxtAZ-v-kLyukLe1UtJ1JY31Th1YaLPh/exec";

    async function saveData() {
        const coin = document.getElementById('coin').value.toUpperCase();
        let price = document.getElementById('price').value.replace(',', '.');
        let qty = document.getElementById('qty').value.replace(',', '.');
        const status = document.getElementById('status');

        if(!coin || !price || !qty) { status.innerText = "❌ Rellena todo"; return; }

        status.style.color = "blue";
        status.innerText = "⏳ Guardando...";

        const payload = { moneda: coin, precio: price, cantidad: qty, fecha: new Date().toLocaleString() };

        try {
            await fetch(URL_APP, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            status.style.color = "green";
            status.innerText = "✅ ¡Guardado!";
            document.getElementById('price').value = "";
            document.getElementById('qty').value = "";
        } catch (e) { status.innerText = "❌ Error"; }
    }

    async function getData() {
        const coin = document.getElementById('searchCoin').value.toUpperCase();
        const area = document.getElementById('displayArea');
        if(!coin) return;

        area.innerHTML = "<p style='text-align:center'>⏳ Consultando...</p>";

        try {
            const res = await fetch(URL_APP + "?moneda=" + coin);
            const d = await res.json();

            if(d.compras.length === 0) { area.innerHTML = "❌ Sin datos"; return; }

            let html = `<div class="result-card">
                <strong>${d.moneda}</strong><br>
                Precio Medio: ${d.precioMedio.toFixed(6)}<br>
                Total: ${d.cantidadTotal}<br>
                Invertido: ${d.invertidoTotal.toFixed(2)}€
                <ul class="historial">`;
            d.compras.forEach(c => {
                html += `<li>${new Date(c.fecha).toLocaleDateString()}: ${c.cantidad} a ${c.precio}</li>`;
            });
            html += `</ul></div>`;
            area.innerHTML = html;
        } catch (e) { area.innerHTML = "❌ Error al conectar"; }
    }
</script>

</body>
</html>
